server {
    listen 80;
    server_name _;
    root /var/www/hubleto;
    server_tokens off;
    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/hubleto/docker/healthcheck.php;
        fastcgi_pass app:9000;
    }

    # Only the front controller is executable over HTTP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/hubleto/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_pass app:9000;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(php|phtml|phar)(/|$) {
        return 404;
    }

    # Hubleto ships its compiled frontend in this Composer package.
    location ~* ^/vendor/hubleto/assets/.+\.(css|js|map|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;
        expires 7d;
    }

    location /vendor/ {
        return 404;
    }

    location /upload/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        rewrite ^/(.*)$ /index.php?route=$1 last;
    }
}
